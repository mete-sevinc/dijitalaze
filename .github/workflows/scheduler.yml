name: scheduler
# GitHub'ın */5 cron'u güvenilmez; bu iş dakikada bir uygulamayı tetikler (hatırlatma + zamanlı mail),
# süresi dolmadan kendini yeniden başlatır. Saatlik schedule yalnızca zincir koparsa devreye girer.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
concurrency:
  group: scheduler
  cancel-in-progress: false
permissions:
  actions: write
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Dakikada bir tetikle
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          end=$(( $(date +%s) + 5*3600 + 50*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            curl --silent --show-error --max-time 50 \
              -H "Authorization: Bearer $CRON_SECRET" \
              https://dijital.aze.com.tr/api/cron/assistant > /dev/null || echo "tick failed"
            sleep 60
          done
      - name: Zinciri sürdür
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scheduler.yml --repo "${{ github.repository }}"
