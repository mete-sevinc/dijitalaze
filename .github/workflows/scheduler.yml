name: scheduler
# Vercel Hobby dakikalık cron vermez; hatırlatma ve zamanlı mailler için dışarıdan tetikler.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://dijital.aze.com.tr/api/cron/assistant
